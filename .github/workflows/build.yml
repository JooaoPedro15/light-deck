# Gera os instaladores do Light Deck para Windows e macOS.
# - Ao criar uma tag v* (ex.: v0.1.1): gera e anexa os instaladores numa Release do GitHub.
# - Manualmente (aba Actions > Instaladores > Run workflow): gera e deixa como artefato do workflow.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessário para criar a Release e anexar arquivos

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          # Sem certificado de assinatura por enquanto.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: light-deck-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Os dois sistemas rodam em paralelo: quem chegar primeiro cria a Release.
          gh release create "$TAG" --title "Light Deck $TAG" --generate-notes || true
          shopt -s nullglob
          gh release upload "$TAG" dist/*.exe dist/*.dmg --clobber
